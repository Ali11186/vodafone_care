name: Krinry Flutter Build
on:
  workflow_dispatch:
    inputs:
      build_type:
        default: 'release'
      output_type:
        default: 'apk'
      target_platform:
        default: 'all'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable

      - name: Setup local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate Flutter files
        run: flutter build apk --release --android-skip-build-dependency-validation || true

      - name: Build with Gradle directly
        run: |
          cd android
          chmod +x gradlew 2>/dev/null || true
          $FLUTTER_ROOT/bin/flutter build apk --release --android-skip-build-dependency-validation || \
          ./gradlew assembleRelease --no-daemon 2>&1 | tail -20 || true

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find . -name "*.apk" ! -path "*/sdk/*" ! -path "*/ndk/*" ! -path "*debug*" 2>/dev/null | head -1)
          echo "APK found: $APK"
          if [ -n "$APK" ]; then
            mkdir -p output
            cp "$APK" output/app-release.apk
            echo "found=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/upload-artifact@v4
        if: steps.find_apk.outputs.found == 'true'
        with:
          name: app-release
          path: output/app-release.apk

      - uses: actions/upload-artifact@v4
        if: steps.find_apk.outputs.found != 'true'
        with:
          name: app-release
          path: |
            build/app/outputs/**/*.apk
            android/app/build/outputs/**/*.apk
          if-no-files-found: warn
