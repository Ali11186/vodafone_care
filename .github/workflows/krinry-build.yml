name: Krinry Flutter Build
on:
  workflow_dispatch:
    inputs:
      build_type:
        default: 'release'
      output_type:
        default: 'apk'
      target_platform:
        default: 'all'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
      - run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties
      - run: flutter pub get
      - run: flutter build apk --release --android-skip-build-dependency-validation
      - name: Upload APK
        run: |
          find . -name "*.apk" ! -path "*/sdk/*" ! -path "*/ndk/*" 2>/dev/null
          mkdir -p output
          APK=$(find . -name "app-release.apk" ! -path "*/sdk/*" ! -path "*/ndk/*" 2>/dev/null | head -1)
          if [ -n "$APK" ]; then cp "$APK" output/app-release.apk; fi
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: output/app-release.apk
          if-no-files-found: warn
