name: Krinry Flutter Build
on:
  workflow_dispatch:
    inputs:
      build_type:
        default: 'release'
      output_type:
        default: 'apk'
      target_platform:
        default: 'all'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
      - run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties
      - run: flutter pub get
      - name: Build APK
        run: flutter build apk --release --android-skip-build-dependency-validation || true
      - name: Find APK
        run: |
          echo "=== Searching for APK ==="
          find /home/runner/work -name "*.apk" 2>/dev/null
          echo "=== Done ==="
          APK=$(find /home/runner/work -name "app-release.apk" 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            mkdir -p output
            cp "$APK" output/app-release.apk
            echo "Found: $APK"
          else
            echo "No APK found!"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: output/app-release.apk
